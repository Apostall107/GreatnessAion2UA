<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#020b15"
  >

  <title>
    GREATNESS — українська гільдія та спільнота AION 2
  </title>

  <meta
    name="description"
    content="GREATNESS — українська гільдія та спільнота AION 2. Знаходь українських гравців, напарників і групи для данжів, рейдів та PvP. Приєднуйся до спільноти."
  >

  <meta
    name="robots"
    content="index, follow"
  >

  <link
    rel="canonical"
    href="https://virheon.github.io/greatness-aion2/"
  >

  <!-- Open Graph -->
  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:site_name"
    content="GREATNESS"
  >

  <meta
    property="og:locale"
    content="uk_UA"
  >

  <meta
    property="og:title"
    content="GREATNESS — українська гільдія та спільнота AION 2"
  >

  <meta
    property="og:description"
    content="Українська спільнота та гільдія AION 2. Гравці, групи, данжі, рейди, PvP, гайди та спільна підготовка до гри."
  >

  <meta
    property="og:url"
    content="https://virheon.github.io/greatness-aion2/"
  >

  <meta
    property="og:image"
    content="https://virheon.github.io/greatness-aion2/assets/section-hero.png"
  >

  <meta
    property="og:image:alt"
    content="GREATNESS — українська спільнота AION 2"
  >

  <!-- Twitter / social preview -->
  <meta
    name="twitter:card"
    content="summary_large_image"
  >

  <meta
    name="twitter:title"
    content="GREATNESS — українська гільдія та спільнота AION 2"
  >

  <meta
    name="twitter:description"
    content="Українська спільнота гравців AION 2. Напарники, групи, данжі, рейди, PvP та спільна підготовка до гри."
  >

  <meta
    name="twitter:image"
    content="https://virheon.github.io/greatness-aion2/assets/section-hero.png"
  >

  <link
    rel="stylesheet"
    href="styles.css"
  >
</head>

<body>

  <main
    class="page"
    id="top"
  >

    <!-- =====================================================
         COMMUNITY / HERO
         ===================================================== -->

    <section
      class="visual hero"
      id="community"
      aria-labelledby="page-title"
    >

      <img
        src="assets/section-hero.png"
        alt="GREATNESS — українська гільдія та спільнота AION 2"
        class="visual__image"
      >

      <!-- Основний H1 для пошукових систем.
           Візуально прихований, щоб не змінювати дизайн. -->
      <h1
        id="page-title"
        style="
          position:absolute;
          width:1px;
          height:1px;
          padding:0;
          margin:-1px;
          overflow:hidden;
          clip:rect(0,0,0,0);
          white-space:nowrap;
          border:0;
        "
      >
        GREATNESS — українська гільдія та спільнота AION 2
      </h1>

      <!-- Header navigation -->

      <a
        class="hotspot hotspot--community"
        href="#community"
        aria-label="Про спільноту GREATNESS"
      ></a>

      <a
        class="hotspot hotspot--features-nav"
        href="#features"
        aria-label="Що на тебе чекає"
      ></a>

      <a
        class="hotspot hotspot--aion-nav"
        href="#aion"
        aria-label="AION 2"
      ></a>

      <a
        class="hotspot hotspot--join-nav"
        href="#join"
        aria-label="Як приєднатися до гільдії"
      ></a>

      <a
        class="hotspot hotspot--header-discord"
        href="https://discord.gg/B3jzsUFMYZ"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Приєднатися до Discord GREATNESS"
      ></a>

      <!-- Hero buttons -->

      <a
        class="hotspot hotspot--hero-discord"
        href="https://discord.gg/B3jzsUFMYZ"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Приєднатися до Discord GREATNESS"
      ></a>

      <a
        class="hotspot hotspot--hero-more"
        href="#features"
        aria-label="Дізнатися більше про GREATNESS"
      ></a>

    </section>


    <!-- =====================================================
         FEATURES
         ===================================================== -->

    <section
      class="visual"
      id="features"
      aria-labelledby="features-title"
    >

      <img
        src="assets/section-features.png"
        alt="Що на тебе чекає у GREATNESS — українські гравці AION 2, групи, данжі, рейди, PvP та допомога"
        class="visual__image"
      >

      <h2
        id="features-title"
        style="
          position:absolute;
          width:1px;
          height:1px;
          padding:0;
          margin:-1px;
          overflow:hidden;
          clip:rect(0,0,0,0);
          white-space:nowrap;
          border:0;
        "
      >
        Що на тебе чекає у GREATNESS
      </h2>

    </section>


    <!-- =====================================================
         AION 2
         ===================================================== -->

    <section
      class="visual"
      id="aion"
      aria-labelledby="aion-title"
    >

      <img
        src="assets/section-aion.png"
        alt="AION 2 — разом до нових вершин з українською спільнотою GREATNESS"
        class="visual__image"
      >

      <h2
        id="aion-title"
        style="
          position:absolute;
          width:1px;
          height:1px;
          padding:0;
          margin:-1px;
          overflow:hidden;
          clip:rect(0,0,0,0);
          white-space:nowrap;
          border:0;
        "
      >
        AION 2 — разом до нових вершин
      </h2>

    </section>


    <!-- =====================================================
         JOIN
         ===================================================== -->

    <section
      class="visual"
      id="join"
      aria-labelledby="join-title"
    >

      <img
        src="assets/section-join.png"
        alt="Як приєднатися до GREATNESS — української гільдії AION 2"
        class="visual__image"
      >

      <h2
        id="join-title"
        style="
          position:absolute;
          width:1px;
          height:1px;
          padding:0;
          margin:-1px;
          overflow:hidden;
          clip:rect(0,0,0,0);
          white-space:nowrap;
          border:0;
        "
      >
        Як приєднатися до GREATNESS
      </h2>

      <a
        class="hotspot hotspot--join-discord"
        href="https://discord.gg/B3jzsUFMYZ"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Приєднатися до Discord GREATNESS"
      ></a>

      <a
        class="hotspot hotspot--question"
        href="mailto:greatness.aion2@gmail.com"
        aria-label="Задати питання GREATNESS"
      ></a>

    </section>


    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer
      class="visual"
      aria-label="GREATNESS — AION 2"
    >

      <img
        src="assets/section-footer.png"
        alt="GREATNESS — AION 2"
        class="visual__image"
      >

    </footer>

  </main>


  <script src="script.js"></script>

</body>
</html>
